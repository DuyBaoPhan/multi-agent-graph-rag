version: "3.9"

services:
  # ============================================================
  # Neo4j - Graph Database (Module B1)
  # ============================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: highlands-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-highlands2024}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./configs/neo4j:/import
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - highlands-net

  # ============================================================
  # Redis - Session Cache & Semantic Cache (Module B2.3, A2.2)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: highlands-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./configs/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - highlands-net

  # ============================================================
  # TEI - Text Embeddings Inference (Module B1.2)
  # ============================================================
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: highlands-tei
    ports:
      - "8080:80"
    command: --model-id ${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B} --port 80
    volumes:
      - tei_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - highlands-net

