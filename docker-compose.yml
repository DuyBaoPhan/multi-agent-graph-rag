  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - highlands-net

  # ============================================================
  # SGLang Generator - Response Generation (Module B2.1)
  # ============================================================
  # sglang-generator:
  #   image: lmsysorg/sglang:latest
  #   container_name: highlands-sglang-generator
  #   ports:
  #     - "30001:30001"
  #   command: >
  #     python -m sglang.launch_server
  #     --model-path ${SGLANG_GENERATOR_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
  #     --port 30001
  #     --mem-fraction-static 0.65
  #     --chunked-prefill-size 2048
  #     --max-running-requests 4
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:30001/health"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #   networks:
  #     - highlands-net

  # ============================================================
  # FastAPI Gateway (All modules)
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: highlands-gateway
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - TEI_HOST=http://tei:80
      # - SGLANG_ROUTER_HOST=http://sglang-router:30000
      # - SGLANG_GENERATOR_HOST=http://sglang-generator:30001
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - highlands-net

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  tei_cache:

networks:
  highlands-net:
    driver: bridge
