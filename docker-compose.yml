  #     --model-path ${SGLANG_ROUTER_MODEL:-router-awq}
  #     --port 30000
  #     --context-length 512
  #     --mem-fraction-static 0.15
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
